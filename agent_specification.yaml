models:
  orchestration: claude-sonnet-4-5

orchestration:
  budget:
    seconds: 120
    tokens: 32000

instructions:
  response: |
    You are the Risk, Fraud and Regulatory Intelligence Copilot.
    
    FORMAT RULES:
    - Include ACCOUNT_ID in every account-level answer.
    - Round monetary values to 2 decimal places in INR.
    - Default time window: last 30 days.
    - Limit output to 20 rows unless asked for more.
    
    GUARDRAILS:
    - OFF-TOPIC (restaurants, weather, sports, personal): Reply "I can only assist with risk, fraud, and regulatory compliance topics."
    - PII REQUESTS (home address, phone, ID numbers): Reply "I cannot disclose personal information for privacy and compliance reasons."
    - AUTO-SUBMIT REQUESTS: Reply "I can only generate DRAFT filings. All regulatory submissions require human review and approval before filing with FIU-IND."
    - NEVER fabricate numbers. Always use tool results.

  orchestration: |
    ROUTING DECISION TREE:

    STEP 1: Off-topic? -> Refuse directly, no tool call.
    STEP 2: About regulations/policies/requirements/guidelines? -> RegulatorySearch
    STEP 3: Explicitly asks to generate/create/draft a SAR/STR? -> GenerateSAR
    STEP 4: Explicitly asks to open/create a case? -> CreateCase
    STEP 5: All other data questions -> RiskDataAnalyst

    MULTI-TOOL:
    - "regulatory basis AND which accounts" -> RegulatorySearch FIRST, then RiskDataAnalyst
    - "look up flags AND generate SAR" -> RiskDataAnalyst FIRST, then GenerateSAR

  sample_questions:
    - question: "Which accounts have the highest risk scores?"
    - question: "What does RBI say about STR filing timelines?"
    - question: "Generate a SAR for account ACC0002981"
    - question: "Open a FRAUD case for ACC0002981"
    - question: "What is the portfolio risk exposure by tier?"

tools:
  - tool_spec:
      type: "cortex_analyst_text_to_sql"
      name: "RiskDataAnalyst"
      description: "Queries STRUCTURED DATA: accounts, transactions, fraud signals, AML flags, risk scores. Do NOT use for regulatory policy text."
  - tool_spec:
      type: "cortex_search"
      name: "RegulatorySearch"
      description: "Searches REGULATORY POLICY DOCUMENTS: RBI, FATF, PMLA, KYC/AML, Basel. Use ONLY for law/regulation questions. Do NOT use for data lookups."
  - tool_spec:
      type: "generic"
      name: "GenerateSAR"
      description: "Generates DRAFT SAR/STR filing. Use ONLY when user explicitly asks to generate/create/draft a SAR or STR."
      input_schema:
        type: "object"
        properties:
          P_ACCOUNT_ID:
            type: "string"
            description: "Account ID (e.g. ACC0002981)"
          P_FLAG_TYPE:
            type: "string"
            description: "STRUCTURING, HIGH_VALUE_INTERNATIONAL, or PEP_ACTIVITY"
          P_EVIDENCE_SUMMARY:
            type: "string"
            description: "Evidence narrative"
        required: [P_ACCOUNT_ID, P_FLAG_TYPE, P_EVIDENCE_SUMMARY]
  - tool_spec:
      type: "generic"
      name: "CreateCase"
      description: "Opens investigation case. Use ONLY when user explicitly asks to open/create a case."
      input_schema:
        type: "object"
        properties:
          P_ACCOUNT_ID:
            type: "string"
            description: "Account ID"
          P_CASE_TYPE:
            type: "string"
            description: "FRAUD, AML, or COMPLIANCE"
          P_PRIORITY:
            type: "string"
            description: "CRITICAL, HIGH, MEDIUM, or LOW"
          P_FINDINGS:
            type: "string"
            description: "Summary of findings"
        required: [P_ACCOUNT_ID, P_CASE_TYPE, P_PRIORITY, P_FINDINGS]
  - tool_spec:
      type: "data_to_chart"
      name: "data_to_chart"
      description: "Generates visualizations from data"

tool_resources:
  RiskDataAnalyst:
    semantic_view: "RISK_FRAUD_COPILOT.SEMANTIC.RISK_FRAUD_INTELLIGENCE"
    execution_environment:
      type: "warehouse"
      warehouse: "ANALYTICS_WH"
  RegulatorySearch:
    search_service: "RISK_FRAUD_COPILOT.DOCUMENTS.REGULATORY_SEARCH"
    max_results: 5
    title_column: "SECTION_TITLE"
    id_column: "DOC_ID"
  GenerateSAR:
    type: "function"
    identifier: "RISK_FRAUD_COPILOT.APP.GENERATE_SAR_REPORT"
    execution_environment:
      type: "warehouse"
      warehouse: "ANALYTICS_WH"
  CreateCase:
    type: "function"
    identifier: "RISK_FRAUD_COPILOT.APP.CREATE_INVESTIGATION_CASE"
    execution_environment:
      type: "warehouse"
      warehouse: "ANALYTICS_WH"
